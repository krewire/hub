name: CI

# ─────────────────────────────────────────────────────────────────────────────
# Krewire Hub Quality-Gate Contract (hub#1)
# Verifies formatting, static analysis, unit/integration tests, and pure-Go
# compilation across all nine independent adapter modules.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-hub-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  GO_VERSION: "1.27.3"

jobs:
  gofmt:
    name: Code Formatting (gofmt)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Verify Formatting
        run: |
          DIFF=$(gofmt -l .)
          if [ -n "$DIFF" ]; then
            echo "::error::Files not formatted with gofmt:"
            echo "$DIFF"
            exit 1
          fi

  module-quality:
    name: Module Quality (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module:
          - mysql
          - plugin
          - postgres
          - redis
          - resolver
          - sqlite
          - svelte
          - tailwind
          - vue
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Provision Core Dependencies
        run: |
          if [ ! -d "../krewire" ]; then
            git clone --depth 1 https://github.com/krewire/krewire.git ../krewire
          fi

      - name: Static Analysis (go vet)
        run: |
          go vet ./${{ matrix.module }}/...

      - name: Unit & Integration Tests (go test)
        run: |
          go test -v -race ./${{ matrix.module }}/...

      - name: Pure-Go Compilation (CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 go build ./${{ matrix.module }}/...

      - name: Record Job Summary
        if: always()
        run: |
          echo "### Module Quality: \`${{ matrix.module }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Source Commit**: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Go Toolchain**: \`${{ env.GO_VERSION }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Module Root**: \`./${{ matrix.module }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"

  ci-ok:
    name: All CI Gates Passed (ci-ok)
    needs: [gofmt, module-quality]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate Aggregate CI Result
        run: |
          if [ "${{ needs.gofmt.result }}" != "success" ] || [ "${{ needs.module-quality.result }}" != "success" ]; then
            echo "::error::One or more required CI gates failed or were cancelled."
            echo "gofmt: ${{ needs.gofmt.result }}"
            echo "module-quality: ${{ needs.module-quality.result }}"
            exit 1
          fi
          echo "All 9 Hub modules and formatting checks passed successfully."
