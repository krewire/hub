name: Nightly Qualification

# ─────────────────────────────────────────────────────────────────────────────
# Krewire Hub Nightly Qualification Pipeline (ADR-R7P3K / hub#1)
# Scheduled daily quality gate validation across all nine Hub adapter modules.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 2 * * *'                      # Daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-hub-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GO_VERSION: "1.27.3"

jobs:
  nightly-matrix:
    name: Nightly Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module:
          - mysql
          - plugin
          - postgres
          - redis
          - resolver
          - sqlite
          - svelte
          - tailwind
          - vue
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Provision Core Dependencies
        run: |
          if [ ! -d "../krewire" ]; then
            git clone --depth 1 https://github.com/krewire/krewire.git ../krewire
          fi

      - name: Static Analysis (go vet)
        run: |
          go vet ./${{ matrix.module }}/...

      - name: Unit & Integration Tests (go test)
        run: |
          go test -v -race ./${{ matrix.module }}/...

      - name: Pure-Go Compilation (CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 go build ./${{ matrix.module }}/...

      - name: Record Nightly Summary
        if: always()
        run: |
          echo "### Nightly Qualification: \`${{ matrix.module }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Source Commit**: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date**: \`$(date -u +%Y-%m-%d)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
